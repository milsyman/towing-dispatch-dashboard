<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&S Towing Dispatch</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {margin:0; font-family:Arial, sans-serif; background:#f4f6f8;}
header {background:#1f2937; color:white; padding:12px;}
nav {display:flex; background:#111827;}
nav button {flex:1; padding:12px; border:none; background:#111827; color:white;}
.tab {display:none; padding:15px;}
input, select, button {padding:10px; margin:5px 0; width:100%;}
button {background:#2563eb; color:white; border:none;}
table {width:100%; border-collapse:collapse;}
th, td {border:1px solid #ccc; padding:6px;}
.status.EnRoute {background:#f97316; color:white;}
.status.Hooked {background:#3b82f6; color:white;}
.status.Completed {background:#16a34a; color:white;}
#map {height:50vh;}
</style>
</head>

<body>

<header>
<h1>M&S Towing</h1>
</header>

<nav>
<button onclick="openTab('jobs')">Jobs</button>
<button onclick="openTab('invoices')">Invoices</button>
<button onclick="openTab('mapTab')">Map</button>
</nav>

<div id="jobs" class="tab">
<form id="jobForm">
<input id="customer" placeholder="Customer Name" required>
<input id="phone" placeholder="Phone" required>
<input id="driver" placeholder="Driver" required>
<input id="truck" placeholder="Truck Address" required>
<input id="pickup" placeholder="Pickup Address" required>
<input id="dropoff" placeholder="Dropoff Address" required>

<button>Add Job</button>
</form>

<table>
<thead><tr><th>Job</th><th>Driver</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="jobsTable"></tbody>
</table>
</div>

<div id="invoices" class="tab">
<table>
<tbody id="invoiceTable"></tbody>
</table>
</div>

<div id="mapTab" class="tab">
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- ✅ FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 YOUR CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyB9mtP2Emr_Dxbpe_x5BO-7edan_vG8Euo",
  authDomain: "dispatch-app-fdcf6.firebaseapp.com",
  projectId: "dispatch-app-fdcf6",
  storageBucket: "dispatch-app-fdcf6.firebasestorage.app",
  messagingSenderId: "460899401434",
  appId: "1:460899401434:web:29dc46e13aba533319afe3",
  measurementId: "G-8Q81M44RD9",
  databaseURL: "https://dispatch-app-fdcf6-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const jobsRef = ref(db, "jobs");

let jobs = [];

/* ✅ REALTIME LISTENER */
onValue(jobsRef, (snapshot) => {
  jobs = [];
  snapshot.forEach(child => {
    jobs.push({ key: child.key, ...child.val() });
  });
  render();
});

/* --- MAP --- */
const map=L.map('map').setView([39,-98],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=[];

/* --- GEO --- */
async function geo(a){
let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);
let d=await r.json();
return d.length?[+d[0].lat,+d[0].lon]:null;
}

/* --- DISTANCE --- */
function miles(a,b){
if(!a||!b) return 0;
let R=3958.8,t=Math.PI/180;
let dLat=(b[0]-a[0])*t,dLon=(b[1]-a[1])*t;
let h=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

/* --- ADD JOB --- */
jobForm.onsubmit=async e=>{
e.preventDefault();

let j={};
j.id="JOB-"+Date.now();
j.customer=customer.value;
j.phone=phone.value;
j.driver=driver.value;
j.status="EnRoute";

j.truck=await geo(truck.value);
j.pick=await geo(pickup.value);
j.drop=await geo(dropoff.value);

j.miles=miles(j.truck,j.pick)+miles(j.pick,j.drop);
j.total=100+(j.miles*5);

j.payment="Unpaid";

/* ✅ SAVE TO FIREBASE */
push(jobsRef, j);

jobForm.reset();
};

/* --- DELETE --- */
window.del = function(i){
remove(ref(db, "jobs/" + jobs[i].key));
}

/* --- EDIT STATUS --- */
window.edit = function(i){
let s=prompt("Status: EnRoute / Hooked / Completed",jobs[i].status);
if(s){
update(ref(db, "jobs/" + jobs[i].key), { status:s });
}
}

/* --- PAYMENT --- */
window.togglePayment = function(i){
let newStatus = jobs[i].payment==="Paid"?"Unpaid":"Paid";
update(ref(db, "jobs/" + jobs[i].key), { payment:newStatus });
}

/* --- RENDER --- */
function render(){
jobsTable.innerHTML="";
markers.forEach(m=>map.removeLayer(m));
markers=[];

jobs.forEach((j,i)=>{
jobsTable.innerHTML+=`
<tr>
<td>${j.id}</td>
<td>${j.driver}</td>
<td class="status ${j.status}">${j.status}</td>
<td>
<button onclick="edit(${i})">Edit</button>
<button onclick="del(${i})">Delete</button>
</td>
</tr>
`;

if(j.pick){
markers.push(L.marker(j.pick).addTo(map).bindPopup(j.customer));
}
});
}

/* --- TABS --- */
window.openTab=function(id){
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.getElementById(id).style.display='block';
}
openTab('jobs');

</script>

</body>
</html>
