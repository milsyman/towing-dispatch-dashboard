<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&S Towing Dispatch</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {margin:0; font-family:Arial; background:#f4f6f8;}
header {background:#1f2937; color:white; padding:12px;}
nav {display:flex; background:#111827;}
nav button {flex:1; padding:12px; border:none; color:white; background:#111827;}
.tab {display:none; padding:15px;}
input, button {width:100%; padding:10px; margin:5px 0;}
table {width:100%; border-collapse:collapse;}
th, td {border:1px solid #ccc; padding:6px;}
.status.EnRoute {background:orange;color:white;}
.status.Hooked {background:blue;color:white;}
.status.Completed {background:green;color:white;}
#map {height:50vh;}
.action{cursor:pointer;color:blue;}
</style>
</head>

<body>

<header><h1>M&S Towing Dispatch</h1></header>

<nav>
<button onclick="openTab('jobs')">Jobs</button>
<button onclick="openTab('invoices')">Invoices</button>
<button onclick="openTab('mapTab')">Map</button>
</nav>

<!-- JOBS -->
<div id="jobs" class="tab">
<form id="jobForm">
<input id="customer" placeholder="Customer" required>
<input id="phone" placeholder="Phone" required>
<input id="driver" placeholder="Driver" required>
<input id="truck" placeholder="Truck Address" required>
<input id="pickup" placeholder="Pickup Address" required>
<input id="dropoff" placeholder="Dropoff Address" required>
<button>Add Job</button>
</form>

<table>
<thead>
<tr><th>Job</th><th>Driver</th><th>Status</th><th>Actions</th></tr>
</thead>
<tbody id="jobsTable"></tbody>
</table>
</div>

<!-- INVOICES -->
<div id="invoices" class="tab">
<table>
<thead>
<tr><th>Job</th><th>Customer</th><th>Driver</th><th>Payment</th><th>Total</th><th>Print</th></tr>
</thead>
<tbody id="invoiceTable"></tbody>
</table>
</div>

<!-- MAP -->
<div id="mapTab" class="tab">
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyB9mtP2Emr_Dxbpe_x5BO-7edan_vG8Euo",
  authDomain: "dispatch-app-fdcf6.firebaseapp.com",
  projectId: "dispatch-app-fdcf6",
  storageBucket: "dispatch-app-fdcf6.firebasestorage.app",
  messagingSenderId: "460899401434",
  appId: "1:460899401434:web:29dc46e13aba533319afe3",
  databaseURL: "https://dispatch-app-fdcf6-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const jobsRef = ref(db, "jobs");

let jobs=[];
let markers=[];

/* MAP */
const map=L.map('map').setView([39,-98],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

/* REALTIME */
onValue(jobsRef, snap=>{
jobs=[];
snap.forEach(c=>{
jobs.push({key:c.key,...c.val()});
});
render();
});

/* GEO */
async function geo(a){
let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);
let d=await r.json();
return d.length?[+d[0].lat,+d[0].lon]:null;
}

/* DISTANCE */
function miles(a,b){
if(!a||!b) return 0;
let R=3958.8,t=Math.PI/180;
let dLat=(b[0]-a[0])*t,dLon=(b[1]-a[1])*t;
let h=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

/* ADD JOB */
jobForm.onsubmit=async e=>{
e.preventDefault();

let j={
id:"JOB-"+Date.now(),
customer:customer.value,
phone:phone.value,
driver:driver.value,
status:"EnRoute",
payment:"Unpaid"
};

j.truck=await geo(truck.value);
j.pick=await geo(pickup.value);
j.drop=await geo(dropoff.value);

j.miles=miles(j.truck,j.pick)+miles(j.pick,j.drop);
j.total=100+(j.miles*5);

push(jobsRef,j);
jobForm.reset();
};

/* DELETE */
window.del=i=>remove(ref(db,"jobs/"+jobs[i].key));

/* EDIT */
window.edit=i=>{
let s=prompt("Status: EnRoute / Hooked / Completed",jobs[i].status);
if(s) update(ref(db,"jobs/"+jobs[i].key),{status:s});
};

/* PAYMENT */
window.togglePayment=i=>{
let p=jobs[i].payment==="Paid"?"Unpaid":"Paid";
update(ref(db,"jobs/"+jobs[i].key),{payment:p});
};

/* PRINT */
window.printInv=i=>{
let j=jobs[i];
let w=window.open("");
w.document.write(`
<h2>Invoice</h2>
<p>Job: ${j.id}</p>
<p>Customer: ${j.customer}</p>
<p>Driver: ${j.driver}</p>
<p>Miles: ${j.miles.toFixed(1)}</p>
<h3>Total: $${j.total.toFixed(2)}</h3>
`);
w.print();
};

/* RENDER */
function render(){
jobsTable.innerHTML="";
invoiceTable.innerHTML="";

/* CLEAR MAP */
markers.forEach(m=>map.removeLayer(m));
markers=[];

let bounds=[];

jobs.forEach((j,i)=>{

/* JOB TABLE */
jobsTable.innerHTML+=`
<tr>
<td>${j.id}</td>
<td>${j.driver}</td>
<td class="status ${j.status}">${j.status}</td>
<td>
<span class="action" onclick="edit(${i})">Edit</span> |
<span class="action" onclick="del(${i})">Delete</span>
</td>
</tr>`;

/* INVOICE TABLE */
invoiceTable.innerHTML+=`
<tr>
<td>${j.id}</td>
<td>${j.customer}</td>
<td>${j.driver}</td>
<td class="action" onclick="togglePayment(${i})">${j.payment}</td>
<td>$${j.total.toFixed(2)}</td>
<td class="action" onclick="printInv(${i})">Print</td>
</tr>`;

/* MAP */
if(j.pick){
let m=L.marker(j.pick).addTo(map)
.bindPopup(`<b>${j.customer}</b><br>${j.driver}<br>${j.id}`);
markers.push(m);
bounds.push(j.pick);
}
});

/* AUTO FIT MAP */
if(bounds.length){
map.fitBounds(bounds,{padding:[50,50]});
}
}

/* TABS */
window.openTab=id=>{
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.getElementById(id).style.display='block';
if(id==="mapTab") setTimeout(()=>map.invalidateSize(),200);
};

openTab('jobs');

</script>

</body>
</html>
