<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&S Towing Dispatch</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {margin:0; font-family:Arial; background:#f4f6f8;}
header {background:#1f2937; color:white; padding:12px;}
nav {display:flex; background:#111827;}
nav button {flex:1; padding:12px; border:none; color:white; background:#111827;}
nav button:hover {background:#374151;}
.tab {display:none; padding:15px;}
input, select, button {width:100%; padding:10px; margin:5px 0;}
button {background:#2563eb; color:white; border:none;}
table {width:100%; border-collapse:collapse;}
th, td {border:1px solid #ccc; padding:6px;}
.status {color:white; padding:2px 6px; border-radius:4px;}
.EnRoute {background:#f97316;}
.Hooked {background:#3b82f6;}
.Completed {background:#16a34a;}
#map {height:50vh;}
.card {background:white; padding:15px; margin:10px 0;}
.action {color:blue; cursor:pointer;}
</style>
</head>

<body>

<header>
<h2>M&S Towing Dispatch</h2>
</header>

<nav>
<button onclick="openTab('jobs')">Jobs</button>
<button onclick="openTab('invoices')">Invoices</button>
<button onclick="openTab('mapTab')">Map</button>
</nav>

<div id="jobs" class="tab card">
<h3>Add Job</h3>
<form id="jobForm">
<input id="customer" placeholder="Customer" required>
<input id="phone" placeholder="Phone" required>
<input id="driver" placeholder="Driver" required>
<input id="truck" placeholder="Truck Address" required>
<input id="pickup" placeholder="Pickup Address" required>
<input id="dropoff" placeholder="Dropoff Address" required>

<select id="priority">
<option>Normal</option><option>Urgent</option><option>Police</option><option>Accident</option>
</select>

<select id="towType">
<option>Impound</option><option>Breakdown</option><option>Repo</option><option>Jumpstart</option>
</select>

<button>Add Job</button>
</form>

<h3>Jobs</h3>
<table>
<thead>
<tr><th>#</th><th>Driver</th><th>Status</th><th>Customer</th><th>Miles</th><th>Total</th><th>Actions</th></tr>
</thead>
<tbody id="jobsTable"></tbody>
</table>
</div>

<div id="invoices" class="tab card">
<h3>Invoices</h3>
<table>
<thead>
<tr><th>#</th><th>Customer</th><th>Driver</th><th>Payment</th><th>Total</th></tr>
</thead>
<tbody id="invoiceTable"></tbody>
</table>
</div>

<div id="mapTab" class="tab card">
<h3>Map</h3>
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

/* 🔥 FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
deleteDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 👉 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyA7s4ASCZ3fY0eJt_rYvLy0e5_e8IJrVuw",
  authDomain: "towing-fb504.firebaseapp.com",
  projectId: "towing-fb504",
  storageBucket: "towing-fb504.firebasestorage.app",
  messagingSenderId: "298894034345",
  appId: "1:298894034345:web:196a2b1884683da3d430b8",
  measurementId: "G-FM4QNN6VB4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const jobsRef = collection(db, "jobs");

/* APP DATA */
const BASE=100, TAX=0.055, RATE=5;
let jobs=[], markers=[];

/* UI */
window.openTab = id=>{
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.getElementById(id).style.display='block';
if(id==="mapTab") setTimeout(()=>map.invalidateSize(),200);
};
openTab('jobs');

/* MAP */
const map=L.map('map').setView([39,-98],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

/* GEO */
async function geo(a){
let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);
let d=await r.json();
return d.length?[+d[0].lat,+d[0].lon]:null;
}

/* DISTANCE */
function miles(a,b){
if(!a||!b) return 0;
let R=3958.8,t=Math.PI/180;
let dLat=(b[0]-a[0])*t,dLon=(b[1]-a[1])*t;
let h=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

/* REALTIME */
onSnapshot(jobsRef, snap=>{
jobs=[];
snap.forEach(d=>jobs.push({...d.data(), docId:d.id}));
render();
});

/* RENDER */
function render(){
jobsTable.innerHTML="";
invoiceTable.innerHTML="";
markers.forEach(m=>map.removeLayer(m)); markers=[];

jobs.forEach((j,i)=>{

jobsTable.innerHTML+=`
<tr>
<td>${j.id}</td>
<td>${j.driver}</td>
<td class="status ${j.status}">${j.status}</td>
<td>${j.customer}</td>
<td>${j.miles.toFixed(1)}</td>
<td>$${j.total.toFixed(2)}</td>
<td>
<span class="action" onclick="edit(${i})">Edit</span> |
<span class="action" onclick="del(${i})">Delete</span>
</td>
</tr>`;

invoiceTable.innerHTML+=`
<tr>
<td>${j.id}</td>
<td>${j.customer}</td>
<td>${j.driver}</td>
<td onclick="togglePayment(${i})" class="action">${j.payment}</td>
<td>$${j.total.toFixed(2)}</td>
</tr>`;

if(j.pick){
markers.push(L.marker(j.pick).addTo(map)
.bindPopup(`${j.customer}<br>${j.driver}`));
}
});
}

/* ADD */
jobForm.onsubmit=async e=>{
e.preventDefault();

let j={};
j.id="JOB-"+Date.now();
j.customer=customer.value;
j.phone=phone.value;
j.driver=driver.value;
j.status="EnRoute";
j.priority=priority.value;
j.towType=towType.value;

j.truck=await geo(truck.value);
j.pick=await geo(pickup.value);
j.drop=await geo(dropoff.value);

j.miles=miles(j.truck,j.pick)+miles(j.pick,j.drop);
j.total=BASE+(BASE*TAX)+(j.miles*RATE);
j.payment="Unpaid";

await addDoc(jobsRef,j);

jobForm.reset();
};

/* DELETE */
window.del=async i=>{
if(confirm("Delete?")){
await deleteDoc(doc(db,"jobs",jobs[i].docId));
}
};

/* EDIT STATUS */
window.edit=async i=>{
let s=prompt("EnRoute / Hooked / Completed",jobs[i].status);
if(s) await updateDoc(doc(db,"jobs",jobs[i].docId),{status:s});
};

/* PAYMENT */
window.togglePayment=async i=>{
let p=jobs[i].payment==="Paid"?"Unpaid":"Paid";
await updateDoc(doc(db,"jobs",jobs[i].docId),{payment:p});
};

</script>
</body>
</html>
