<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&S Towing Real-Time Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body {margin:0; font-family:Arial; background:#f4f6f8;}
header {background:#1f2937; color:white; padding:12px; text-align:center;}
nav {display:flex; background:#111827;}
nav button {flex:1; padding:12px; border:none; color:white; background:#111827; cursor:pointer;}
.tab {display:none; padding:15px; overflow:auto; height:80vh;}
table {width:100%; border-collapse:collapse; margin-top:10px;}
th, td {border:1px solid #ccc; padding:6px;}
.status.EnRoute {background:orange;color:white;}
.status.Hooked {background:blue;color:white;}
.status.Completed {background:green;color:white;}
#map {height:80vh; width:100%; min-height:500px;}
.action{cursor:pointer;color:blue;}
#legend {background:white;padding:10px;position:absolute;bottom:10px;left:10px;z-index:999;}
#legend div{margin:5px 0;}
ul {list-style:none; padding:0;}
li {background:rgba(0,0,0,0.2); padding:5px; margin:3px 0; border-radius:5px; word-wrap:break-word;}
</style>
</head>
<body>

<header><h1>M&S Towing Real-Time Dashboard</h1></header>
<nav>
  <button onclick="openTab('mapTab')">Map</button>
  <button onclick="openTab('jobsTab')">Jobs</button>
  <button onclick="openTab('chatTab')">Driver Chat</button>
</nav>

<!-- MAP TAB -->
<div id="mapTab" class="tab">
  <div id="map"></div>
  <div id="legend">
    <div><span style="color:orange;font-weight:bold;">●</span> Job Pickup</div>
    <div><span style="color:blue;font-weight:bold;">●</span> Tow Request</div>
    <div><span style="color:purple;font-weight:bold;">●</span> Driver Chat</div>
  </div>
</div>

<!-- JOBS TAB -->
<div id="jobsTab" class="tab">
  <h2>Dispatch Jobs</h2>
  <form id="jobForm">
    <input id="customer" placeholder="Customer" required>
    <input id="phone" placeholder="Phone" required>
    <input id="driver" placeholder="Driver" required>
    <input id="truck" placeholder="Truck Address" required>
    <input id="pickup" placeholder="Pickup Address" required>
    <input id="dropoff" placeholder="Dropoff Address" required>
    <button>Add Job</button>
  </form>
  <table>
    <thead><tr><th>Job</th><th>Driver</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="jobsTable"></tbody>
  </table>
</div>

<!-- CHAT TAB -->
<div id="chatTab" class="tab">
  <h2>Driver Chat</h2>
  <input id="message" placeholder="Type your message here" style="width:70%">
  <button id="sendBtn" disabled>Send</button>
  <ul id="messages"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, onChildAdded, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ===== FIREBASE CONFIGS ===== */
const dispatchApp = initializeApp({
  apiKey: "AIzaSyB9mtP2Emr_Dxbpe_x5BO-7edan_vG8Euo",
  authDomain: "dispatch-app-fdcf6.firebaseapp.com",
  databaseURL: "https://dispatch-app-fdcf6-default-rtdb.firebaseio.com/",
  projectId: "dispatch-app-fdcf6",
  storageBucket: "dispatch-app-fdcf6.firebasestorage.app",
  messagingSenderId: "460899401434",
  appId: "1:460899401434:web:29dc46e13aba533319afe3"
}, "dispatchApp");
const dbDispatch = getDatabase(dispatchApp);
const jobsRef = ref(dbDispatch, "jobs");

const chatApp = initializeApp({
  apiKey: "AIzaSyC4RwUjxX9x118vXdlfr6UEZGC0rwL6-HE",
  authDomain: "chat-1cb54.firebaseapp.com",
  databaseURL: "https://chat-1cb54-default-rtdb.firebaseio.com/",
  projectId: "chat-1cb54",
  storageBucket: "chat-1cb54.firebasestorage.app",
  messagingSenderId: "353414353280",
  appId: "1:353414353280:web:e1c5c865ce0abfd9c0b165"
}, "chatApp");
const dbChat = getDatabase(chatApp);
const messagesRef = ref(dbChat, 'messages');

const towApp = initializeApp({
  apiKey: "AIzaSyAgsss6WKIPj_dfjWC_W3oViKF4iTPbw6Q",
  authDomain: "ms-towing.firebaseapp.com",
  databaseURL: "https://ms-towing-default-rtdb.firebaseio.com/",
  projectId: "ms-towing",
  storageBucket: "ms-towing.firebasestorage.app",
  messagingSenderId: "983593521689",
  appId: "1:983593521689:web:2d37b648199b684cf99088"
}, "towApp");
const dbTow = getDatabase(towApp);
const towRef = ref(dbTow, 'locations');

/* ===== LEAFLET MAP ===== */
const map = L.map('map').setView([39,-98],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let jobMarkers=[], towMarkers=[], chatMarkers=[];

function clearMarkers(arr){ arr.forEach(m=>map.removeLayer(m)); arr.length=0; }

/* ===== GEO HELPERS ===== */
async function geo(address){
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
  const data = await res.json();
  return data.length?[+data[0].lat,+data[0].lon]:null;
}

/* ===== JOBS LOGIC ===== */
let jobs=[];
document.getElementById('jobForm').onsubmit = async e=>{
  e.preventDefault();
  const j = {
    id: "JOB-" + Date.now(),
    customer: customer.value,
    phone: phone.value,
    driver: driver.value,
    status: "EnRoute",
    payment: "Unpaid",
    truck: await geo(truck.value),
    pick: await geo(pickup.value),
    drop: await geo(dropoff.value)
  };
  push(jobsRef, j);
  e.target.reset();
};

onValue(jobsRef, snap=>{
  jobs=[]; snap.forEach(c=>jobs.push({key:c.key,...c.val()}));
  renderJobsTable(); renderMap(); // live update
});

function renderJobsTable(){
  const table = document.getElementById('jobsTable'); table.innerHTML="";
  jobs.forEach((j,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML=`<td>${j.id}</td><td>${j.driver}</td><td class="status ${j.status}">${j.status}</td>
      <td><span class="action" onclick="editJob(${i})">Edit</span> | <span class="action" onclick="delJob(${i})">Del</span></td>`;
    table.appendChild(tr);
  });
}

window.editJob = i=>{
  let s=prompt("Status: EnRoute / Hooked / Completed",jobs[i].status);
  if(s) update(ref(dbDispatch,"jobs/"+jobs[i].key),{status:s});
};
window.delJob = i=>remove(ref(dbDispatch,"jobs/"+jobs[i].key));

/* ===== DRIVER CHAT ===== */
let currentAddress=null;
const sendBtn=document.getElementById('sendBtn');
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    currentAddress=`Lat:${pos.coords.latitude}, Lon:${pos.coords.longitude}`;
    sendBtn.disabled=false;
  }, ()=>{ sendBtn.disabled=true; });
}
sendBtn.addEventListener('click', ()=>{
  const msg = document.getElementById('message').value.trim();
  if(!currentAddress) return alert("Location not ready");
  push(messagesRef,{message:msg, location:currentAddress, time:new Date().toISOString()});
  document.getElementById('message').value="";
});

onChildAdded(messagesRef, snap=>{
  const data = snap.val();
  const li = document.createElement('li');
  li.textContent=(data.message||"")+" | 📍 "+(data.location||"");
  document.getElementById('messages').appendChild(li);

  if(data.location){
    const coords = data.location.match(/Lat:(.*), Lon:(.*)/);
    if(coords){
      const lat = parseFloat(coords[1]), lon=parseFloat(coords[2]);
      const m = L.circleMarker([lat,lon],{color:'purple'}).addTo(map)
        .bindPopup(`<b>Chat Message</b><br>${data.message}<br>${data.time}`);
      chatMarkers.push(m);
      fitMapBounds();
    }
  }
});

/* ===== TOW LOCATIONS ===== */
onValue(towRef, snap=>{
  clearMarkers(towMarkers);
  const data = snap.val()||{};
  Object.values(data).forEach(loc=>{
    if(!loc.lat||!loc.lon) return;
    const m=L.marker([Number(loc.lat),Number(loc.lon)],{icon:null}).addTo(map)
      .bindPopup(`<b>Tow Request</b><br>${loc.address}<br>${loc.time||''}`);
    towMarkers.push(m);
  });
  fitMapBounds();
});

/* ===== RENDER MAP ===== */
function renderMap(){
  clearMarkers(jobMarkers);
  jobs.forEach(j=>{
    if(j.pick){
      const m = L.marker(j.pick).addTo(map)
        .bindPopup(`<b>Job ID:</b> ${j.id}<br><b>Customer:</b> ${j.customer}<br><b>Driver:</b> ${j.driver}<br>
          <b>Pickup:</b> ${j.pick}<br><b>Dropoff:</b> ${j.drop}<br><b>Status:</b> ${j.status}<br>
          <b>Payment:</b> ${j.payment}`);
      jobMarkers.push(m);
    }
  });
  fitMapBounds();
}

function fitMapBounds(){
  const allMarkers = [...jobMarkers,...towMarkers,...chatMarkers];
  if(allMarkers.length){
    const group = L.featureGroup(allMarkers);
    map.fitBounds(group.getBounds().pad(0.2));
  }
}

/* ===== TABS ===== */
function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.getElementById(id).style.display='block';
  setTimeout(()=>map.invalidateSize(true),300);
}
openTab('mapTab');

</script>
</body>
</html>
